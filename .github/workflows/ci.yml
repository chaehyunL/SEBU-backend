name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean test --no-daemon

      - name: Build runtime container
        run: docker build --tag sebu-backend:ci .

      - name: Start runtime container and smoke test
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --publish 18080:8080 \
            --env SPRING_PROFILES_ACTIVE=local \
            --env JWT_SECRET_BASE64="$(openssl rand -base64 32)" \
            sebu-backend:ci)
          trap 'docker rm --force "$container_id" > /dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/laboratories > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id"
          exit 1
