plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sebu'
version = '0.0.1-SNAPSHOT'
description = 'SEBU backend service'

ext['tomcat.version'] = '10.1.59'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.jsoup:jsoup:1.23.1'
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
	implementation 'org.conscrypt:conscrypt-openjdk-uber:2.6.3'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
		showCauses = true
		showStackTraces = true
	}
	if (project.hasProperty('excludeDocker')) {
		exclude '**/*MySql*', '**/BookmarkConcurrencyIntegrationTest*', '**/ProdContainerHealthcheckIntegrationTest*'
	}
	maxParallelForks = 1
	systemProperty 'spring.test.context.cache.maxSize', '3'
}

tasks.named('bootRun') {
	doFirst {
		// application.yml defaults to local. Only supply a development key for
		// that unconfigured invocation; explicit Spring configuration stays strict.
		def explicitSpringConfig = args.any { it.startsWith('--spring.') } ||
			(environment + systemProperties).any { key, value ->
				value && (key.startsWith('SPRING_') || key.startsWith('spring.'))
			}
		def explicitTokenConfig = environment.containsKey('JWT_SECRET_BASE64') ||
			environment.containsKey('APP_AUTH_TOKEN_JWT_SECRET_BASE64') ||
			systemProperties.containsKey('app.auth.token.jwt-secret-base64') ||
			args.any { it.startsWith('--app.auth.token.') }
		if (!explicitSpringConfig && !explicitTokenConfig) {
			byte[] localKey = new byte[32]
			new java.security.SecureRandom().nextBytes(localKey)
			environment 'JWT_SECRET_BASE64', java.util.Base64.encoder.encodeToString(localKey)
			logger.lifecycle('bootRun: using a temporary local JWT key; restarting invalidates local tokens.')
		}
	}
}
