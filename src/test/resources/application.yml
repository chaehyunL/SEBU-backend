spring:
  datasource:
    url: jdbc:h2:mem:sebu-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true

app:
  rate-limit:
    max-requests: 30
    window: 1m
